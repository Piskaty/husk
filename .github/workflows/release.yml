name: Verify Husk Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  verify-release:
    name: Test & Package macOS Release (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run safety & scanner test suite
        run: swift test

      - name: Package Husk.app, DMG, ZIP, and latest.json
        env:
          HUSK_VERSION: ${{ steps.version.outputs.version }}
          HUSK_GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/build-app.sh scripts/package-release.sh
          ./scripts/package-release.sh --release
