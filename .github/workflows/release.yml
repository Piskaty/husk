name: Release Husk

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Package macOS Release (arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run safety & scanner test suite
        run: swift test

      - name: Package Husk.app, DMG, ZIP, and latest.json
        env:
          HUSK_VERSION: ${{ steps.version.outputs.version }}
          HUSK_GITHUB_REPO: ${{ github.repository }}
        run: |
          chmod +x scripts/build-app.sh scripts/package-release.sh
          ./scripts/package-release.sh --release

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: |
            dist/Husk-*.dmg
            dist/Husk-*.zip
            dist/latest.json
            dist/SHA256SUMS.txt
